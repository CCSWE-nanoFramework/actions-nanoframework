name: 'Setup nanoFramework'
description: 'Installs the nanoFramework build components, nanoclr, MSBuild and NuGet'

inputs:
  usePreview:
    description: 'Install preview versions of the nanoFramework build components'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup nanoFramework
      uses: nanoframework/nanobuild@v1
      with:
        usePreview: ${{ inputs.usePreview }}
        gitHubAuth: ${{ github.token }}

    - name: Update nanoclr
      shell: pwsh
      run: dotnet tool update -g nanoclr

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Setup NuGet
      uses: nuget/setup-nuget@v4
