name: 'Setup nanoFramework'
description: 'Installs the nanoFramework build components, nanoclr, MSBuild and NuGet'

inputs:
  usePreview:
    description: 'Install preview versions of the nanoFramework build components'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup nanoFramework
      # Pinned to the merge commit of nanoframework/nanobuild#4 (VS2026 support)
      # until a tagged release is available; revert to @v1 once released.
      uses: nanoframework/nanobuild@7c31aa93121b2f6fc97b3ce74655cc48b2c2c505
      with:
        usePreview: ${{ inputs.usePreview }}
        gitHubAuth: ${{ github.token }}

    - name: Update nanoclr
      shell: pwsh
      run: dotnet tool update -g nanoclr

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Setup NuGet
      uses: nuget/setup-nuget@v4
