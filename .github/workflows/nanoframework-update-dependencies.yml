name: nanoframework-update-dependencies

# Reusable workflow that updates nanoFramework NuGet packages with nanodu and
# opens a PR as the andy-the-messenger-robot App (so the PR triggers checks),
# then closes older update PRs it supersedes.
#
# Caller:
#
#   jobs:
#     update-dependencies:
#       uses: CCSWE-nanoFramework/actions-nanoframework/.github/workflows/nanoframework-update-dependencies.yml@master
#       with: { solution: <path to .sln> }
#       secrets: inherit

on:
  workflow_call:
    inputs:
      solution:
        type: string
        required: true
    secrets:
      AUTOMATION_APP_ID:
        required: true
      AUTOMATION_APP_KEY:
        required: true

jobs:
  update-dependencies:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: CCSWE-nanoFramework/actions-nanoframework/.github/actions/setup-nanoframework@master

      - name: Update dependencies
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ github.event.repository.default_branch }}
          DOTNET_NOLOGO: 'true'
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOLUTION: ${{ inputs.solution }}
        run: |
          user="${APP_SLUG}[bot]"
          id="$(gh api "users/${user}" -q .id)"
          tools="$(cygpath -u "$RUNNER_TEMP")/nanodu"
          dotnet tool install nanodu --tool-path "$tools"
          "$tools/nanodu" \
            --working-directory "$GITHUB_WORKSPACE" \
            --stable-packages \
            --solutions-to-check "$SOLUTION" \
            --branch-to-pr "$BRANCH" \
            --git-hub-user "$user" \
            --git-hub-email "${id}+${user}@users.noreply.github.com" \
            --git-hub-auth "$GH_TOKEN"

  close-superseded:
    needs: update-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Close superseded update PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          mapfile -t prs < <(gh pr list -R "$REPO" --state open --limit 100 --json number,headRefName,createdAt \
            -q '[.[] | select(.headRefName | startswith("nfbot/update-dependencies/"))] | sort_by(.createdAt) | reverse | .[].number')
          if [ ${#prs[@]} -le 1 ]; then
            exit 0
          fi
          newest="${prs[0]}"
          for pr in "${prs[@]:1}"; do
            gh pr close "$pr" -R "$REPO" --delete-branch --comment "Superseded by #${newest}."
          done
